# Dolt SQL server configuration for test fixtures (disposable store).
#
# Placed by install.sh when SPIRA_TESTDB_DATA is set; never overwritten so the
# operator can tune it. Source template: systemd/dolt-server-test.yaml in the harness.
# The store at @SPIRA_TESTDB_DATA@ is disposable: no real data, no remote, no backup.
log_level: warning

listener:
  port: @SPIRA_TESTDB_PORT@
  max_connections: 1000
  read_timeout_millis: 1800000
  write_timeout_millis: 1800000

data_dir: "@SPIRA_TESTDB_DATA@"

behavior:
  dolt_transaction_commit: false
  event_scheduler: "OFF"
